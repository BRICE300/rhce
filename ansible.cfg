[defaults]
remote_user = ansible
roles_path = /home/devops/rhce/roles:/usr/share/ansible/roles
collections_path = /home/devops/rhce/mycollection:/home/devops/.ansible/collections:/usr/share/ansible/collections
inventory = /home/devops/rhce/inventory

[privilege_escalation]

become = true
become_user = root
become_method = sudo

