---
- name: SElinux port management
  hosts: dev
  become: true



  tasks: 

    - name: Allow sshd to listen on tcp port 8991
      community.general.seport:
        ports: 2222
        proto: tcp
        setype: ssh_port_t
        state: present

    - name: Allow port 2222 in firewalld
      ansible.posix.firewalld:
        port: 2222/tcp
        permanent: true
        immediate: true
        state: enabled


    - name: Configure SSH daemon port
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?Port '
        line: 'Port 2222'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: sshd
        state: restarted
